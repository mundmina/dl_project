# Cue or distractor (paper): ResNet-18 with a controlled background cue of strength rho = 0.5.
# Swapped backgrounds (p = 0.5) come from the breed's own "home" scene category with probability rho (bgbias.cue).
# Must match resnet_B.yaml except name and rho; rho = 0 is resnet_B itself.
name: cue_rho050
p_swap: 0.5
rho: 0.5
epochs: 15
batch_size: 64
lr_backbone: 1.0e-4
lr_head: 1.0e-3
weight_decay: 1.0e-4
img_size: 224
include_border: true
blur_sigma: 1.5
